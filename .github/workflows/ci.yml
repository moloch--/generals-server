name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build embedded applications
        run: |
          npm ci --ignore-scripts --prefix web
          npm run --prefix web build:all

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Test pure-Go build
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Build server
        run: CGO_ENABLED=0 go build -trimpath ./cmd/generals-server

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build container
        run: docker build --tag generals-server:test .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --prefix web

      - name: Type-check frontend source
        run: npm run --prefix web typecheck

      - name: Build embedded applications
        run: npm run --prefix web build:all

      - name: Verify embedded assets are generated and ignored
        run: |
          test -s internal/app/adminui/dist/index.html
          test -s internal/app/publicui/dist/index.html
          test -z "$(git ls-files -- internal/app/adminui/dist internal/app/publicui/dist)"
          git check-ignore --quiet internal/app/adminui/dist/index.html
          git check-ignore --quiet internal/app/publicui/dist/index.html

      - name: Verify public assets contain no admin client
        run: |
          test -s internal/app/publicui/dist/index.html
          if grep --recursive --line-number --extended-regexp \
            '/api/admin/v1/|generals-server-admin-token|generals-admin' \
            internal/app/publicui/dist; then
            echo "public assets contain an admin API or credential marker" >&2
            exit 1
          fi

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive deployments/aws

      - name: Validate bootstrap stack
        run: |
          terraform -chdir=deployments/aws/bootstrap init -backend=false -input=false
          terraform -chdir=deployments/aws/bootstrap validate

      - name: Validate deployment stack
        run: |
          terraform -chdir=deployments/aws/terraform init -backend=false -input=false
          terraform -chdir=deployments/aws/terraform validate

      - name: Test infrastructure plans offline
        run: |
          terraform -chdir=deployments/aws/bootstrap test
          terraform -chdir=deployments/aws/terraform test

      - name: Check host scripts
        run: |
          sh -n deployments/renew-certificate.sh
          for script in deployments/aws/runtime/generals-*; do
            case "$script" in
              *.service|*.timer) continue ;;
            esac
            bash -n "$script"
          done
          bash -n deployments/aws/terraform/templates/user-data.sh.tftpl

      - name: Render AWS Compose definition
        env:
          AWS_REGION: us-west-2
          CLOUDWATCH_LOG_GROUP: /generals-server/test/server
          GENERALS_IMAGE: 123456789012.dkr.ecr.us-west-2.amazonaws.com/generals-server@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          GENERALS_PLATFORM: linux/arm64
          GENERALS_ADMIN_HOST: 127.0.0.1
          GENERALS_PUBLIC_HOST: online.example.net
          GENERALS_PUBLIC_WEB_HOST: example.net
        run: |
          docker compose -f deployments/aws/runtime/compose.yaml config --format json | jq --exit-status '
            .services["generals-server"] as $service |
            $service.ports as $ports |
            any($ports[]; .target == 8443 and (.published | tostring) == "443") and
            any($ports[]; .target == 8083 and (.published | tostring) == "80") and
            any($ports[]; .target == 8080 and .host_ip == "127.0.0.1") and
            any($ports[]; .target == 8081 and .host_ip == env.GENERALS_ADMIN_HOST) and
            all($ports[]; .target != 8082) and
            ($service.command | index("--public-web-tls-cert=/tls/fullchain.pem") != null) and
            ($service.command | index("--public-web-tls-key=/tls/privkey.pem") != null) and
            ($service.command | index("--public-web-canonical-host=" + env.GENERALS_PUBLIC_WEB_HOST) != null)
          '

      - name: Render standard Compose definition
        env:
          GENERALS_ADMIN_HOST: 100.64.0.1
          GENERALS_ADMIN_TOKEN_FILE: /tmp/generals-admin-token
          GENERALS_ADMIN_TLS_CERT: /tls/fullchain.pem
          GENERALS_ADMIN_TLS_KEY: /tls/privkey.pem
          GENERALS_DATA_DIR: /tmp/generals-data
          GENERALS_GID: "1000"
          GENERALS_PUBLIC_HOST: online.example.net
          GENERALS_TLS_DIR: /tmp/generals-tls
          GENERALS_UID: "1000"
        run: |
          docker compose config --format json | jq --exit-status '
            .services["generals-server"] as $service |
            $service.ports as $ports |
            any($ports[]; .target == 8443 and (.published | tostring) == "443") and
            any($ports[]; .target == 8083 and (.published | tostring) == "80") and
            any($ports[]; .target == 8080 and .host_ip == "127.0.0.1") and
            any($ports[]; .target == 8081 and .host_ip == env.GENERALS_ADMIN_HOST) and
            all($ports[]; .target != 8082) and
            ($service.command | index("--public-web-listen=:8443") != null) and
            ($service.command | index("--public-web-tls-cert=/tls/fullchain.pem") != null) and
            ($service.command | index("--public-web-tls-key=/tls/privkey.pem") != null) and
            ($service.command | index("--public-web-redirect-listen=:8083") != null) and
            ($service.command | index("--public-web-canonical-host=" + env.GENERALS_PUBLIC_HOST) != null) and
            ($service.command | index("--admin-tls-cert=" + env.GENERALS_ADMIN_TLS_CERT) != null) and
            ($service.command | index("--admin-tls-key=" + env.GENERALS_ADMIN_TLS_KEY) != null)
          '

name: generals-server

services:
  generals-server:
    image: ${GENERALS_IMAGE:-generals-server:local}
    build:
      context: ${GENERALS_BUILD_CONTEXT:-.}
    container_name: generals-server
    user: "${GENERALS_UID:?set GENERALS_UID}:${GENERALS_GID:?set GENERALS_GID}"
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    command:
      - --public-host=${GENERALS_PUBLIC_HOST:?set GENERALS_PUBLIC_HOST}
      - --data-file=/data/profiles.db
      - --tls-cert=/tls/fullchain.pem
      - --tls-key=/tls/privkey.pem
      - --admin-listen=:8081
      - --admin-token-file=/run/secrets/admin-token
      - --public-web-listen=:8082
    ports:
      - "29900:29900/tcp"
      - "27901:27901/udp"
      - "127.0.0.1:8080:8080/tcp"
      - "8082:8082/tcp"
      - target: 8081
        published: "8081"
        protocol: tcp
        host_ip: "${GENERALS_ADMIN_HOST:?set GENERALS_ADMIN_HOST}"
    volumes:
      - type: bind
        source: ${GENERALS_DATA_DIR:?set GENERALS_DATA_DIR}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${GENERALS_TLS_DIR:?set GENERALS_TLS_DIR}
        target: /tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GENERALS_ADMIN_TOKEN_FILE:?set GENERALS_ADMIN_TOKEN_FILE}
        target: /run/secrets/admin-token
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
